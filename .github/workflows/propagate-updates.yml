name: Propagate Updates

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/dependabot-autosetup/**'

jobs:
  propagate:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dlr-developer'
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v7

      - name: Propagate to Target Repositories
        env:
          PROPAGATE_TOKEN: ${{ secrets.PROPAGATE_TOKEN }}
        run: |
          # Fetch all repositories owned by dlr-developer
          REPOS_JSON=$(curl -fsSL \
            -H "Authorization: token $PROPAGATE_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/repos?per_page=100" 2>/dev/null)
          
          # Parse repo names from JSON using standard grep/sed to avoid external jq dependencies
          REPO_NAMES=$(echo "$REPOS_JSON" | grep -oP '"name": "\K[^"]+' | sort -u)
          
          for repo in $REPO_NAMES; do
            # Skip the tool repository itself
            [ "$repo" = "dependabot-autosetup" ] && continue
            
            # Use GitHub contents API to verify if target directory exists (immediate check, no search indexing lag)
            API_URL="https://api.github.com/repos/dlr-developer/${repo}/contents/scripts/dependabot-autosetup"
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              -H "Authorization: token $PROPAGATE_TOKEN" \
              "$API_URL")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "────────────────────────────────────────"
              echo "Target found! Propagating updates to: $repo"
              echo "────────────────────────────────────────"
              
              # Clone target repository
              git clone "https://dlr-developer:${PROPAGATE_TOKEN}@github.com/dlr-developer/${repo}.git" target_repo
              
              # Copy scripts/dependabot-autosetup/ files
              mkdir -p target_repo/scripts/dependabot-autosetup/
              cp -r scripts/dependabot-autosetup/* target_repo/scripts/dependabot-autosetup/
              
              cd target_repo
              
              # Configure git author details
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              # Staging and checking changes
              git add scripts/dependabot-autosetup/
              if git diff --staged --quiet; then
                echo "No changes to propagate for $repo."
              else
                git commit -m "Auto-update dependabot-autosetup tool files from main release"
                
                # Detect default branch name (main or master)
                DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
                echo "Pushing changes to branch: $DEFAULT_BRANCH"
                git push origin "HEAD:$DEFAULT_BRANCH"
              fi
              
              cd ..
              rm -rf target_repo
            fi
          done

