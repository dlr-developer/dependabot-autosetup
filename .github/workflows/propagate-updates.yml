name: Propagate Updates

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/dependabot-autosetup/**'

jobs:
  propagate:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dlr-developer'
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Propagate to Target Repositories
        env:
          PROPAGATE_TOKEN: ${{ secrets.PROPAGATE_TOKEN }}
        run: |
          TARGETS=("ai-framer" "repair-replay" "Frigsy" "ebay_scraper" "buybaq-2.0")
          
          for repo in "${TARGETS[@]}"; do
            echo "────────────────────────────────────────"
            echo "Propagating updates to: $repo"
            echo "────────────────────────────────────────"
            
            # Clone target repository
            git clone "https://dlr-developer:${PROPAGATE_TOKEN}@github.com/dlr-developer/${repo}.git" target_repo
            
            # Copy scripts/dependabot-autosetup/ files
            mkdir -p target_repo/scripts/dependabot-autosetup/
            cp -r scripts/dependabot-autosetup/* target_repo/scripts/dependabot-autosetup/
            
            cd target_repo
            
            # Configure git author details
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Staging and checking changes
            git add scripts/dependabot-autosetup/
            if git diff --staged --quiet; then
              echo "No changes to propagate for $repo."
            else
              git commit -m "Auto-update dependabot-autosetup tool files from main release"
              
              # Detect default branch name (main or master)
              DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
              echo "Pushing changes to branch: $DEFAULT_BRANCH"
              git push origin "HEAD:$DEFAULT_BRANCH"
            fi
            
            cd ..
            rm -rf target_repo
          done
